[pytest]
testpaths = tests
# --cov* : cobertura del paquete app/. El piso (--cov-fail-under) hace fallar la corrida si baja;
#          subilo a medida que crezcan las pruebas. El detalle navegable queda en htmlcov/.
addopts =
    -p no:cacheprovider
    --cov=app
    --cov-report=term-missing:skip-covered
    --cov-report=xml:coverage.xml
    --cov-fail-under=90
filterwarnings =
    ignore::DeprecationWarning
