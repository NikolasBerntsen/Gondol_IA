# Content-Security-Policy de la SPA (index.html). Va solo en los documentos de la app: la API (JSON, imágenes y el
# Swagger UI de /api/swagger-ui.html) no la lleva.
#
# - script-src 'self': todo el JS sale de /assets y de /theme-init.js; no hay scripts inline ni eval.
# - style-src 'unsafe-inline': Radix, Recharts y Sonner usan atributos style y <style> generados en tiempo de ejecución.
# - img-src data: blob:: imágenes de adjuntos (AuthImage → blob:), vistas previas de la cámara y "Capturar pantalla"
#   (html-to-image arma un SVG data:). font-src data:: Vite embebe como data: los archivos de fuente chicos.
#   Si algún día se muestran imágenes de otro origen (p. ej. el imageUrl de Open Food Facts), agregalo a img-src.
# - connect-src: la API (mismo origen) y el WebSocket de STOMP (ws/wss al mismo host, ver $gondolia_csp_websocket).
# - frame-ancestors 'none': la app no se muestra dentro de iframes (igual que X-Frame-Options: DENY).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' $gondolia_csp_websocket; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
