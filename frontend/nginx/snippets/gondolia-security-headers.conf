# Headers de seguridad de TODAS las respuestas (app, API, WebSocket y errores de nginx). nginx es el único que los
# define hacia el navegador: en /api/ y /ws se ocultan los mismos headers que manda Spring Security
# (gondolia-proxy.conf), así cada uno sale una sola vez y con un solo valor. Los valores coinciden con los del backend
# (SecurityConfig), que los manda por su cuenta cuando se lo usa sin nginx.
#
# Se incluye también en cada location que define su propio add_header, porque en nginx un add_header en la location
# anula los heredados del server.
#
# Sin Strict-Transport-Security a propósito: el certificado lo firma una CA local que no todos los equipos tienen
# instalada, los puertos no son los estándar y en localhost se usa HTTP. HSTS haría que el navegador fuerce HTTPS en
# http://localhost:8080 (que no lo tiene) y no dejaría aceptar el certificado a mano.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
