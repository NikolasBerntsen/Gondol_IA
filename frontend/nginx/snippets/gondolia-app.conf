# GondolIA - rutas compartidas por los servidores HTTP (:80) y HTTPS (:443).

root  /usr/share/nginx/html;
index index.html;

include /etc/nginx/snippets/gondolia-security-headers.conf;

location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# CA local para instalar en el celular (así el navegador confía en el certificado HTTPS).
location = /gondolia-ca.crt {
    alias /etc/nginx/certs/gondolia-ca.crt;
    types { }
    default_type application/x-x509-ca-cert;
    include /etc/nginx/snippets/gondolia-security-headers.conf;
    add_header Cache-Control "no-cache" always;
}

# API REST del backend (Spring Boot).
location /api/ {
    set $gondolia_backend http://backend:8080;
    proxy_pass $gondolia_backend;
    include /etc/nginx/snippets/gondolia-proxy.conf;
    proxy_set_header Connection "";

    client_max_body_size  15m;
    proxy_connect_timeout 5s;
    proxy_send_timeout    180s;
    proxy_read_timeout    180s;

    # Solo errores generados por nginx (backend caído o reiniciándose, cuerpo mayor a client_max_body_size): se
    # responden con el mismo JSON de error que la API. Las respuestas del backend pasan tal cual.
    error_page 502 503 504 = @gondolia_backend_unavailable;
    error_page 413 = @gondolia_request_too_large;
}

# WebSocket (STOMP): conexiones de larga duración.
location ~ ^/ws(?:/|$) {
    set $gondolia_backend http://backend:8080;
    proxy_pass $gondolia_backend;
    include /etc/nginx/snippets/gondolia-proxy.conf;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_buffering       off;
    proxy_connect_timeout 5s;
    proxy_send_timeout    1h;
    proxy_read_timeout    1h;
}

# Errores propios de nginx en /api/ con el formato de error de la API (docs/api-foundation.md §4).
location @gondolia_backend_unavailable {
    default_type "application/json; charset=utf-8";
    include /etc/nginx/snippets/gondolia-security-headers.conf;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "10" always;
    return 503 '{"timestamp":"$time_iso8601","status":503,"error":"Service Unavailable","code":"SERVICE_UNAVAILABLE","message":"El servidor de GondolIA no responde. Si recién lo iniciaste, esperá unos segundos y volvé a intentar.","path":"$gondolia_error_path","fieldErrors":[]}';
}

# Cuerpo mayor a client_max_body_size: la misma respuesta que da el backend cuando supera su límite de 15 MB
# (400 INVALID_FILE), en lugar de la página HTML "413 Request Entity Too Large".
location @gondolia_request_too_large {
    default_type "application/json; charset=utf-8";
    include /etc/nginx/snippets/gondolia-security-headers.conf;
    add_header Cache-Control "no-store" always;
    return 400 '{"timestamp":"$time_iso8601","status":400,"error":"Bad Request","code":"INVALID_FILE","message":"El archivo supera el tamaño máximo permitido (15 MB)","path":"$gondolia_error_path","fieldErrors":[]}';
}

# Archivos de Vite con hash en el nombre: cache de larga duración.
location /assets/ {
    try_files $uri =404;
    include /etc/nginx/snippets/gondolia-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# index.html nunca se cachea: así cada nueva versión se ve de inmediato.
location = /index.html {
    include /etc/nginx/snippets/gondolia-security-headers.conf;
    include /etc/nginx/snippets/gondolia-csp.conf;
    add_header Cache-Control "no-cache" always;
}

# SPA: cualquier ruta que no sea un archivo existente la resuelve React Router.
location / {
    try_files $uri /index.html;
    include /etc/nginx/snippets/gondolia-security-headers.conf;
    include /etc/nginx/snippets/gondolia-csp.conf;
    add_header Cache-Control "no-cache" always;
}
