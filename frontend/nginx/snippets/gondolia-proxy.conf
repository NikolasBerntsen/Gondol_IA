# Headers hacia el backend (Spring Boot). Los map están en conf.d/gondolia.conf.
# nginx es el borde: X-Forwarded-For se fija con la IP real y no se confía en lo que mande el cliente.
proxy_http_version 1.1;
proxy_set_header Host              $gondolia_proxy_host;
proxy_set_header Origin            $gondolia_upstream_origin;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $gondolia_forwarded_port;
