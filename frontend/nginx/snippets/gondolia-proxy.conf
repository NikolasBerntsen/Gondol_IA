# Headers hacia el backend (Spring Boot). Los map están en conf.d/gondolia.conf.
# nginx es el borde: X-Forwarded-For se fija con la IP real y no se confía en lo que mande el cliente.
# X-Forwarded-Proto lleva el esquema que ve el navegador ($gondolia_public_scheme), no el del salto interno:
# detrás de Caddy el tramo hasta acá es HTTP y el backend armaría URLs http:// para un sitio https://.
proxy_http_version 1.1;
proxy_set_header Host              $gondolia_proxy_host;
proxy_set_header Origin            $gondolia_upstream_origin;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $gondolia_public_scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $gondolia_forwarded_port;

# Headers de seguridad: los define nginx (gondolia-security-headers.conf). Se ocultan los que manda Spring Security para
# que no salgan duplicados (p. ej. "X-Frame-Options: DENY" dos veces) ni HSTS.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Strict-Transport-Security;
