<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F3F5F1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D1410" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="GondolIA: gestión inteligente de inventario para comercios. Tu negocio siempre a tiempo." />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Tema elegido (Claro / Oscuro) antes del primer pintado, para que no parpadee. "Sistema" = sin atributo.
      // Misma clave y colores que src/theme/theme.ts; después lo mantiene el ThemeProvider.
      (function () {
        try {
          var theme = window.localStorage.getItem('gondolia.theme');
          if (theme !== 'light' && theme !== 'dark') return;
          document.documentElement.setAttribute('data-theme', theme);
          document.querySelector('meta[name="color-scheme"]').setAttribute('content', theme);
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) {
            metas[i].setAttribute('content', theme === 'dark' ? '#0D1410' : '#F3F5F1');
          }
        } catch (e) {
          // Sin storage (navegación privada): sigue al sistema.
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>GondolIA</title>
  </head>
  <body>
    <noscript>Para usar GondolIA necesitás habilitar JavaScript en tu navegador.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
