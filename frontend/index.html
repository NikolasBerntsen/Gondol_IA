<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F3F5F1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D1410" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="GondolIA: gestión inteligente de inventario para comercios. Tu negocio siempre a tiempo." />
    <meta name="color-scheme" content="light dark" />
    <!-- Aplica el tema elegido antes del primer pintado (sin parpadeo). Sin defer/async: tiene que bloquear. -->
    <script src="/theme-init.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Vista previa al compartir el enlace (WhatsApp, Slack, Telegram, LinkedIn, X, Discord).
         Las direcciones van absolutas a propósito: los robots que arman la tarjeta no resuelven
         rutas relativas. La imagen la genera frontend/scripts/generar-og-image.py. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GondolIA" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:title" content="GondolIA" />
    <meta property="og:description" content="GondolIA: gestión inteligente de inventario para comercios. Tu negocio siempre a tiempo." />
    <meta property="og:url" content="https://gondolia.nikolasberntsen.com.ar/" />
    <meta property="og:image" content="https://gondolia.nikolasberntsen.com.ar/og-gondolia.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="GondolIA · Tu negocio siempre a tiempo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GondolIA" />
    <meta name="twitter:description" content="GondolIA: gestión inteligente de inventario para comercios. Tu negocio siempre a tiempo." />
    <meta name="twitter:image" content="https://gondolia.nikolasberntsen.com.ar/og-gondolia.png" />
    <meta name="twitter:image:alt" content="GondolIA · Tu negocio siempre a tiempo" />

    <title>GondolIA</title>
  </head>
  <body>
    <noscript>Para usar GondolIA necesitás habilitar JavaScript en tu navegador.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
