server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # Detrás de nginx: respeta X-Forwarded-Proto/Host (URLs de Swagger y redirecciones con https).
  forward-headers-strategy: native
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: gondolia-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT_INTERNAL:5432}/${POSTGRES_DB:gondolia}
    username: ${POSTGRES_USER:gondolia}
    password: ${POSTGRES_PASSWORD:gondolia}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      pool-name: gondolia-db
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
      write-durations-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    generator:
      write-bigdecimal-as-plain: true
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/swagger-ui.html
    persist-authorization: true

logging:
  level:
    com.gondolia: INFO

app:
  jwt:
    # Solo para desarrollo local: en docker compose start.sh genera JWT_SECRET aleatorio.
    secret: ${JWT_SECRET:gondolia-dev-only-secret-do-not-use-in-production-0123456789abcdefghijklmnop}
    expiration-hours: ${JWT_EXPIRATION_HOURS:12}
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
  storage:
    dir: ${APP_STORAGE_DIR:./data/uploads}
  timezone: ${APP_TIMEZONE:America/Argentina/Buenos_Aires}
  seed-demo: ${APP_SEED_DEMO:true}
  dev-fixture: ${APP_DEV_FIXTURE:false}
  openfoodfacts-enabled: ${APP_OPENFOODFACTS_ENABLED:true}
  bootstrap:
    owner-email: ${APP_BOOTSTRAP_OWNER_EMAIL:dueno@gondolia.app}
    owner-password: ${APP_BOOTSTRAP_OWNER_PASSWORD:Gondolia2026!}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
